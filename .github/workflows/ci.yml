name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore NuGet packages
        run: nuget restore src/ADS.sln

      - name: Build Release
        run: msbuild src/ADS.sln /t:Build /p:Configuration=Release /p:Platform="Any CPU"

      - name: Archive output
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          $zipPath = "artifacts/ADS.Wizard.zip"
          Compress-Archive -Path "src/ADS.Wizard/bin/Release/*" -DestinationPath $zipPath -Force
          Write-Host "Created $zipPath"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ADS.Wizard-drop
          path: artifacts/ADS.Wizard.zip
