name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-rc.*"

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore NuGet packages
        run: nuget restore src/ADS.sln

      - name: Build Release
        run: msbuild src/ADS.sln /t:Build /p:Configuration=Release /p:Platform="Any CPU"

      - name: Package release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          $tag = "${{ github.ref_name }}"
          $zip = "artifacts/ADS-$tag.zip"
          Compress-Archive -Path `
            "src/ADS.Wizard/bin/Release/*", `
            "scripts/*", `
            "docs/*", `
            "README.md", `
            "AGENTS.md" `
            -DestinationPath $zip -Force
          Write-Host "Created $zip"

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc.') }}

      - name: Upload asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: artifacts/ADS-${{ github.ref_name }}.zip
          asset_name: ADS-${{ github.ref_name }}.zip
          asset_content_type: application/zip
